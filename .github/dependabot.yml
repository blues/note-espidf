version: 2

updates:
  - package-ecosystem: gitsubmodule
    schedule:
      interval: "daily"
    directory: "."

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
