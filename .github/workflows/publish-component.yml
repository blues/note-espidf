name: Publish ESP-IDF Component

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check tag matches manifest version
        run: |
          manifest_version="$(sed -nE 's/^version: "([^"]+)"$/\1/p' idf_component.yml)"
          if [ "${GITHUB_REF_NAME#v}" != "$manifest_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match idf_component.yml version \"$manifest_version\". Bump the manifest version before tagging."
            exit 1
          fi

      - name: Upload component to ESP Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "notecard: ."
          namespace: blues
          version: ${{ github.ref_name }}
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
